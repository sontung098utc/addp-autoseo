/* ========== tính toán ========== */
const isOff=s=>dow(s)===0||!!HOL[s]||!!S.off[s];
function isWork(s){return !isOff(s);}
function nextWork(s){let d=s,g=0;while(isOff(d)&&g++<400)d=addDays(d,1);return d;}

 if((S.st[t.id]||'todo')==='done')return 1;let d=0;t.subs.forEach((s,i)=>{if(subDone(t,i))d+=s[1];});return t.h?d/t.h:0;}
function status(t){return t.lane==='dev1'?S.d1[t.id].st:(S.st[t.id]||'todo');}

 if(status(t)==='done')return 0;return Math.max(0,t.h*(1-pct(t)));}
function sat(t){const s=status(t);return s==='done'||(t.lane==='dev1'&&s==='review');}
function tasksInOrder(){const base=S.order&&S.order.length?S.order.slice():DEFAULT_ORDER.slice();DEFAULT_ORDER.forEach(id=>{if(base.indexOf(id)<0)base.push(id);});return base.filter(id=>{const t=TMAP[id];return t&&(!t.extra||S.extraOn[id]);});}

function compute(){
 const today=TODAY();const res={};const left={dev2:{},dev1:{}};
 const cap=(lane,day)=>{if(isOff(day))return 0;if(lane==='dev2'){if(S.cap[day]!=null&&S.cap[day]!=='')return +S.cap[day];return day===today?+S.settings.todayHours:Math.max(0,+S.settings.daily-+S.settings.reserve);}return +S.settings.dev1Hours;};
 const lf=(lane,day)=>{if(left[lane][day]==null)left[lane][day]=cap(lane,day);return left[lane][day];};
 function sched(id){
  if(res[id])return res[id];const t=TMAP[id];if(!t)return null;
  const r={id,start:null,finish:null,alloc:{},rem:remaining(t),reason:'',chain:null,earliest:today};res[id]=r;
  let earliest=today,reason='hôm nay',chain=null;
  const bump=(d,why,ch)=>{if(d>earliest){earliest=d;reason=why;chain=ch;}};
  (t.deps||[]).forEach(dep=>{const dt=TMAP[dep];if(!dt||sat(dt))return;const dr=sched(dep);if(!dr||!dr.finish)return;
    bump(dt.lane===t.lane?dr.finish:nextWork(addDays(dr.finish,1)),'đợi '+dt.code+(dt.lane==='dev1'?' (Dev1)':''),dep);});
  (t.gates||[]).forEach(g=>{const G=GMAP[g],gs=S.gates[g];if(G.hard&&!gs.got&&gs.exp)bump(nextWork(gs.exp),'đợi '+G.short,'gate:'+g);});
  const hold=(S.f[id]||{}).hold;if(hold)bump(hold,'tạm hoãn đến '+fmt(hold),null);
  if(t.startWith){const sr=sched(t.startWith);if(sr&&sr.start)bump(sr.start,'cùng '+TMAP[t.startWith].code,t.startWith);}
  if(t.lane==='dev1'&&S.settings.dev1From)bump(S.settings.dev1From,'Dev1 rảnh từ '+fmt(S.settings.dev1From),null);
  r.earliest=earliest;
  if(r.rem<=1e-9){r.done=true;return r;}
  let day=nextWork(earliest),remain=r.rem,guard=0;const per=t.perDay||Infinity;
  while(remain>1e-9&&guard++<900){const l=lf(t.lane,day);const a=Math.min(remain,l,per);
    if(a>1e-9){r.alloc[day]=(r.alloc[day]||0)+a;left[t.lane][day]-=a;remain-=a;if(!r.start)r.start=day;r.finish=day;}
    day=nextWork(addDays(day,1));}
  r.reason=(r.start&&r.start>nextWork(earliest))?'đợi nguồn lực (Dev bận việc khác trước đó)':reason;r.chain=chain;
  return r;}
 const order=tasksInOrder();order.forEach(sched);
 // milestone

  const due=MS[k].due;let rag='ok';if(fin){const d=diffDays(fin,due);rag=d<=0?'ok':d<=3?'warn':'bad';}ms[k]={fin,due,rag,slip:fin?diffDays(fin,due):0};});
 return {today,res,ms,order};
}
function chainOf(res,id){const out=[];let cur=id,g=0;while(cur&&g++<20){const t=TMAP[cur];const r=res[cur];if(!t||!r)break;out.push({id:cur,code:t.code,lane:t.lane,start:r.start,finish:r.finish,reason:r.reason});

const SCREENS=[['Tổng quan','dashboard.html',true,'—','Filament Dashboard + widget','Thấp'],['Chiến dịch','campaigns.html',true,'3.4','Resource + trang cấu hình','Trung bình'],['Bài viết (workshop)','article-workshop.html',true,'3.4','Editor tùy biến, sửa từng đoạn','Cao'],['Duyệt bài','article-review.html',true,'3.4 · 3.5','Page 2 cột + iframe sandbox','Trung bình'],['Lịch đăng','calendar.html',true,'2.2 · 3.6','Cần plugin lịch/kéo thả','Cao'],['Từ khóa','keywords.html',true,'2.1','Resource + import CSV','Thấp'],['Website kết nối','websites.html',true,'0.5','Resource','Thấp'],['Sơ đồ luồng','flows.html',true,'tài liệu','không cần port','—'],['Kế hoạch nội dung','content-plan.html',false,'2.2','kéo thả theo tuần','Cao'],['Audit SEO','seo-audit.html',false,'1.3','Table + filter + CSV','Thấp'],['Search Console','search-console.html',false,'5.1','Biểu đồ so sánh kỳ','Trung bình'],['Đối thủ & khoảng trống','competitors.html',false,'5.4','Table + bản đồ chủ đề','Trung bình'],['Chi phí AI','ai-usage.html',false,'6.5 (Dev1)','Widget + ngưỡng cảnh báo','Thấp'],['Thành phần UI (styleguide)','styleguide.html',false,'—','Tham chiếu theme','—']];
function viewDesign(C){
 const have=SCREENS.filter(s=>s[2]).length;
 let h='<h2>Thiết kế giao diện: DeepSeek làm được 8/14, còn thiếu 6</h2><p class="lead">Brief "Editorial Ledger" (design-system/DESIGN_BRIEF.md) nhất quán và có tính nghề: trạng thái luôn nhìn thấy, duyệt ≠ xếp lịch, AI là công cụ chứ không phải người, một nút primary mỗi màn hình; kèm bộ QA (99 lượt chụp/đo tương phản/tràn ngang). Tôi đã mở trang dashboard thật trong trình duyệt: hiển thị đúng, tương phản tốt. Vấn đề không nằm ở chất lượng phần đã làm mà ở <b>khoảng cách giữa mockup HTML và Filament</b>.</p>';
 h+='<div class="grid g4"><div class="card kpi"><div class="l">Trang đã có</div><div class="v num">'+have+' / '+SCREENS.length+'</div><div class="c">phủ đủ V1.0–V1.1 (0.5, 3.4, 2.1)</div></div><div class="card kpi"><div class="l">Liên kết chết trong sidebar</div><div class="v num">6</div><div class="c">content-plan, seo-audit, search-console, competitors, ai-usage, styleguide</div></div><div class="card kpi"><div class="l">Cần trước</div><div class="v num">2</div><div class="c">content-plan (trước 2.2) và seo-audit (trước 1.3)</div></div></div>';
 h+='<h3>Bản đồ màn hình ↔ task</h3><div class="tw"><table><thead><tr><th>Màn hình</th><th>Mockup</th><th>Task</th><th>Cách làm trong Filament 3</th><th>Rủi ro port</th></tr></thead><tbody>'+SCREENS.map(s=>'<tr><td>'+esc(s[0])+'</td><td>'+(s[2]?chip('có','ok')+' <a href="../../../design-system/pages/'+s[1]+'" target="_blank" rel="noopener" class="small">'+s[1]+'</a>':chip('thiếu','bad')+' <span class="small mono">'+s[1]+'</span>')+'</td><td>'+esc(s[3])+'</td><td class="small">'+esc(s[4])+'</td><td>'+esc(s[5])+'</td></tr>').join('')+'</tbody></table></div>';
 h+='<h3>Đánh giá thẳng</h3><ul>'
 +'<li><b>Mockup dùng nhãn khác enum thật:</b> "Cần sửa" (≈ rejected), "Đã kiểm", "Sạch"… Phải chốt bảng ánh xạ nhãn tiếng Việt ↔ <code>planned/drafting/needs_review/approved/rejected/scheduled/published</code> và <code>scheduled/publishing/published/failed/needs_reconcile</code> trước khi code 3.4, nếu không UI sẽ có trạng thái mà DB không có.</li>'
 +'<li><b>Chi phí port chưa nằm trong WBS:</b> 0.5 (10h) và 3.4 (10h) chỉ phủ phần chức năng. Theme theo tokens (màu, font, badge, mật độ bảng) ≈ 6h — đề xuất X1, lấy từ dự phòng 15%. Không port ⌘K tùy biến và kéo thả ở V1: Filament có phím tắt tìm kiếm toàn cục; lịch kéo thả để dành 2.2.</li>'
 +'<li><b>Dữ liệu trong mockup là hư cấu</b> (tên chiến dịch, chi phí, điểm chất lượng). Chấp nhận để chốt UI, nhưng không đưa số trong mockup vào báo cáo hay tài liệu nghiệm thu.</li>'
 +'<li><b>Câu hỏi mở của brief ảnh hưởng thiết kế còn thiếu:</b> chi phí VND hay USD (ai-usage), số thương hiệu đồng thời (6.4), có cần tiếng Anh trong giao diện (6.2), có cần mobile. Cần hỏi quản lý trước khi làm 2 trang tương ứng.</li>'
 +'<li><b>Giữ nguyên:</b> 6 mục điều hướng, một accent teal-petrol, serif chỉ trong vùng đọc, số liệu monospace tabular — rẻ để giữ và tạo bản sắc.</li></ul>';
 h+='<p class="note">Bật/tắt việc thiết kế ngoài WBS ở tab "Công việc" (X1, X2, X4); chúng sẽ được xếp vào lịch.</p>';
 return h;}

/* ========== TAB: Nhật ký & báo cáo ========== */
function viewReport(C){const today=C.today;
 let h='<h2>Ghi giờ</h2><div class="card"><div class="small" style="display:flex;flex-wrap:wrap;gap:8px;align-items:end"><label>Ngày<br><input type="date" id="lg-d" value="'+today+'"></label><label>Việc<br><select id="lg-t">'+d2active().map(t=>'<option value="'+t.id+'">'+esc(t.code)+' · '+esc(t.name.slice(0,48))+'</option>').join('')+'</select></label><label>Giờ<br><input type="number" id="lg-h" step=".25" min="0" max="16" style="width:70px"></label><label style="flex:1;min-width:220px">Ghi chú<br><input id="lg-n" style="width:100%"></label><label><input type="checkbox" id="lg-b"> có blocker</label><button class="btn pri" data-act="addlog">Thêm</button></div></div>';
 const last=S.log.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,30);
 h+='<div class="tw" style="margin-top:8px"><table><thead><tr><th>Ngày</th><th>Việc</th><th>Giờ</th><th>Ghi chú</th><th></th></tr></thead><tbody>'+(last.map(e=>'<tr><td>'+fmtW(e.date)+'</td><td>'+esc((TMAP[e.task]||{}).code||e.task)+'</td><td class="num">'+n1(+e.hours)+'</td><td>'+(e.blocker?chip('blocker','bad')+' ':'')+esc(e.note)+'</td><td><button class="btn sm" data-dellog="'+e.id+'">Xóa</button></td></tr>').join('')||'<tr><td colspan="5" class="muted">Chưa có nhật ký.</td></tr>')+'</tbody></table></div>';
 const bars=[];for(let i=13;i>=0;i--){const d=addDays(today,-i);const s=S.log.filter(e=>e.date===d).reduce((a,e)=>a+(+e.hours||0),0);bars.push([d,s]);}
 const mx=Math.max(6,...bars.map(b=>b[1]));
 h+='<h3>Giờ ghi nhận 14 ngày gần nhất</h3><svg viewBox="0 0 560 90" width="100%" style="max-width:640px" role="img" aria-label="Giờ theo ngày">'+bars.map((b,i)=>'<rect x="'+(i*40+6)+'" y="'+(70-b[1]/mx*60)+'" width="28" height="'+(b[1]/mx*60)+'" rx="3" fill="'+(isOff(b[0])?'#9a988f':'#0f6b5c')+'"><title>'+fmt(b[0])+': '+n1(b[1])+'h</title></rect><text x="'+(i*40+20)+'" y="86" font-size="9" text-anchor="middle" style="fill:var(--muted)">'+fmt(b[0]).slice(0,5)+'</text>').join('')+'</svg>';
 h+='<h2>Báo cáo cuối ngày (theo DAILY_REPORT_TEMPLATE.md)</h2><div class="small" style="margin-bottom:6px"><label>Ngày <input type="date" id="rp-d" value="'+(S.rpDate||today)+'"></label> <button class="btn sm" data-act="genreport">Tạo báo cáo</button> <button class="btn sm" data-act="copyreport">Sao chép</button> <span class="note">Lưu thành <code>reports/daily/YYYY-MM-DD-dev2.md</code></span></div><pre id="rp-out" style="min-height:90px">'+esc(S.rpText||'Bấm "Tạo báo cáo": tự điền việc nhỏ đã tick trong ngày, giờ từ nhật ký, nhánh/SHA/PR, mức bằng chứng và blocker.')+'</pre>';
 h+='<h2>Dòng cho sheet 7_Bao_cao_hang_ngay</h2><p class="lead">Mỗi việc đúng một dòng. Cột: Mã việc · Trạng thái · Ngày hoàn thành · Ghi chú · Bằng chứng/PR · Tiến độ. Chỉ chọn "Hoàn thành" khi người thật đã kiểm chứng.</p><button class="btn sm" data-act="copytsv">Sao chép TSV (việc Dev2)</button><pre id="tsv" style="max-height:220px">'+esc(sheet7Tsv())+'</pre>';
 h+='<h2>Sao lưu</h2><p class="lead">Dữ liệu nằm trong localStorage của trình duyệt này. Xóa dữ liệu trình duyệt sẽ mất — hãy <b>Xuất JSON</b> cuối mỗi tuần và lưu vào <code>reports/daily/</code> hoặc Git riêng.</p><button class="btn sm" data-act="reset">Xóa toàn bộ dữ liệu bảng này</button>';
 return h;}
function sheet7Tsv(){const rows=[];d2active().filter(t=>!t.extra&&!t.overhead).forEach(t=>{const st=status(t),f=S.f[t.id]||{};const lab=({todo:'Chưa bắt đầu',doing:'Đang làm',blocked:'Bị chặn',review:'Chờ review',done:'Hoàn thành'})[st];
 const doneDate=st==='done'?(lastSubDate(t)||''):'';rows.push([t.code,lab,doneDate,(f.note||'').replace(/\s+/g,' '),[f.pr,f.sha].filter(Boolean).join(' '),Math.round(pct(t)*100)/100].join('\t'));});return rows.join('\n');}
function lastSubDate(t){const m=S.sub[t.id]||{};let d='';Object.keys(m).forEach(k=>{if(typeof m[k]==='string'&&m[k]>d)d=m[k];});return d;}
function genReport(date){const ents=S.log.filter(e=>e.date===date);const ids=[];ents.forEach(e=>{if(ids.indexOf(e.task)<0)ids.push(e.task);});
 d2active().forEach(t=>{(S.sub[t.id]?Object.keys(S.sub[t.id]):[]).forEach(k=>{if(S.sub[t.id][k]===date&&ids.indexOf(t.id)<0)ids.push(t.id);});});
 if(!ids.length)return 'Không có nhật ký hoặc việc nhỏ nào được tick trong ngày '+date+'.';
 return ids.map(id=>{const t=TMAP[id];if(!t)return '';const f=S.f[id]||{},e=S.ev[id]||{};const hrs=S.log.filter(x=>x.date===date&&x.task===id).reduce((a,x)=>a+(+x.hours||0),0);
  const done=t.subs.filter((s,i)=>S.sub[id]&&S.sub[id][i]===date),todo=t.subs.filter((s,i)=>!(S.sub[id]&&S.sub[id][i])).slice(0,4);
  const blk=ents.filter(x=>x.task===id&&x.blocker).map(x=>x.note);const gts=(t.gates||[]).filter(g=>!S.gates[g].got).map(g=>GMAP[g].short);
  const live=e.L3?'[x] Đã test Live | [ ] Test Mock | [ ] Chưa chạy':e.L2?'[ ] Đã test Live | [x] Test Mock | [ ] Chưa chạy':'[ ] Đã test Live | [ ] Test Mock | [x] Chưa chạy';
  return ['# BÁO CÁO NGÀY '+date+' — Dev2 — Task '+t.code,'','## 1. Thông tin phiên','* Ngày làm việc: '+date,'* Nhân sự: Dev2','* Mã công việc: '+t.code,'* Nhánh Git: '+t.branch,'* Base Commit SHA: '+(f.base||'…'),'* Commit SHA hoàn thành: '+(f.sha||'…'),'* Pull Request URL: '+(f.pr||'…'),'','## 2. Nội dung đã thực hiện',done.map(s=>'* [x] '+s[0]).join('\n')||'* (chưa tick việc nhỏ nào hôm nay)',todo.map(s=>'* [ ] '+s[0]).join('\n'),'','## 3. Bằng chứng kiểm thử','* Mức: '+['L1 code','L2 mock','L3 staging','L4 người thật'].filter((x,i)=>e['L'+(i+1)]).join(' → ')+(e.L1||e.L2||e.L3||e.L4?'':'(chưa đạt mức nào)'),'* Trạng thái CMS/dịch vụ ngoài: '+live,'* Lệnh kiểm thử / kết quả: …','','## 4. Chi phí & thời gian','* Giờ công thực tế phiên này: '+n1(hrs)+' giờ','* Chi phí API phát sinh: …','','## 5. Khó khăn & điểm nghẽn',(blk.concat(gts.map(g=>'Chờ cổng: '+g)).map(x=>'* '+x).join('\n'))||'* Không','','## 6. Xác nhận reviewer','* Reviewer: Dev1','* Đánh giá: [ ] Đồng ý nghiệm thu | [ ] Yêu cầu sửa đổi','* Ghi chú: …'].join('\n');}).join('\n\n---\n\n');}

/* ========== vẽ ========== */
function render(){const C=compute();window.__C=C;$('#hdr-date').textContent='Hôm nay '+fmtW(C.today)+'/'+pd(C.today).getUTCFullYear();renderTabs();
 const scroll=window.scrollY;const v={overview:viewOverview,tasks:viewTasks,plan:viewPlan,deps:viewDeps,system:viewSystem,world:viewWorld,design:viewDesign,report:viewReport}[S.tab]||viewOverview;
 $('#view').innerHTML=v(C);window.scrollTo(0,scroll);}
function touch(){save();render();}

/* ========== sự kiện ========== */
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;save();render();window.scrollTo(0,0);return;}
 const a=e.target.closest('[data-act]');
 if(a){const act=a.dataset.act;
  if(act==='export'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='dev2-dashboard-'+TODAY()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),500);}
  else if(act==='reset'){if(confirm('Xóa toàn bộ tiến độ, nhật ký và cài đặt? Hãy Xuất JSON trước.')){S=JSON.parse(JSON.stringify(DEF));GATES.forEach(g=>{S.gates[g.id]={exp:g.exp,got:false};});D1.forEach(t=>{S.d1[t.id]={st:t.st,rem:t.h};});touch();}}
  else if(act==='resetorder'){S.order=null;touch();}
  else if(act==='setcap'){const d=$('#capd').value,h=$('#caph').value;if(d&&h!==''){S.cap[d]=+h;touch();}}
  else if(act==='delcap'){e.preventDefault();delete S.cap[a.dataset.d];touch();}
  else if(act==='addlog'){const d=$('#lg-d').value,t=$('#lg-t').value,h=parseFloat($('#lg-h').value);if(!d||!t||!(h>=0)){alert('Cần ngày, việc và số giờ.');return;}S.log.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),date:d,task:t,hours:h,note:$('#lg-n').value,blocker:$('#lg-b').checked});touch();}
  else if(act==='genreport'){S.rpDate=$('#rp-d').value;S.rpText=genReport(S.rpDate);touch();}
  else if(act==='copyreport'||act==='copytsv'){const txt=act==='copytsv'?sheet7Tsv():(S.rpText||'');copyText(txt);}
  return;}
 const dl=e.target.closest('[data-dellog]');if(dl){S.log=S.log.filter(x=>x.id!==dl.dataset.dellog);touch();return;}
 const mv=e.target.closest('[data-mv]');if(mv){const p=mv.dataset.mv.split(':');const o=tasksInOrder();const i=o.indexOf(p[0]);const dir=+p[1];
  // đổi chỗ với việc Dev2 kế cận
  let j=i+dir;while(j>=0&&j<o.length&&TMAP[o[j]].lane!=='dev2')j+=dir;if(j<0||j>=o.length)return;const t=o[i];o[i]=o[j];o[j]=t;S.order=o;touch();return;}
 const sm=e.target.closest('details.task>summary');if(sm){const d=sm.parentElement;setTimeout(()=>{S.open[d.dataset.id]=d.open;save();},0);}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='imp'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.v!==1)throw 0;S=Object.assign({},DEF,o);S.settings=Object.assign({},DEF.settings,o.settings||{});GATES.forEach(g=>{if(!S.gates[g.id])S.gates[g.id]={exp:g.exp,got:false};});D1.forEach(x=>{if(!S.d1[x.id])S.d1[x.id]={st:x.st,rem:x.h};});touch();}catch(err){alert('Tệp JSON không hợp lệ.');}};r.readAsText(f);return;}
 const g=k=>t.dataset[k];
 if(g('sub')){const p=g('sub').split(':');S.sub[p[0]]=S.sub[p[0]]||{};S.sub[p[0]][p[1]]=t.checked?TODAY():false;
  const task=TMAP[p[0]];if(t.checked&&(S.st[p[0]]||'todo')==='todo')S.st[p[0]]='doing';touch();}
 else if(g('st')){S.st[g('st')]=t.value;if(t.value==='done'){const task=TMAP[g('st')];S.sub[task.id]=S.sub[task.id]||{};task.subs.forEach((s,i)=>{if(!S.sub[task.id][i])S.sub[task.id][i]=TODAY();});}touch();}
 else if(g('f')){const p=g('f').split(':');S.f[p[0]]=S.f[p[0]]||{};S.f[p[0]][p[1]]=t.value;touch();}
 else if(g('ev')){const p=g('ev').split(':');S.ev[p[0]]=S.ev[p[0]]||{};S.ev[p[0]][p[1]]=t.checked;touch();}
 else if(g('extra')){S.extraOn[g('extra')]=t.checked;touch();}
 else if(g('set')){S.settings[g('set')]=t.type==='number'?(t.value===''?0:+t.value):t.value;touch();}
 else if(g('gexp')){S.gates[g('gexp')].exp=t.value;touch();}
 else if(g('gget')){S.gates[g('gget')].got=t.checked;touch();}
 else if(g('d1')){S.d1[g('d1')].st=t.value;if(t.value==='done'||t.value==='review')S.d1[g('d1')].rem=0;touch();}
 else if(g('d1rem')){S.d1[g('d1rem')].rem=+t.value;touch();}
 else if(g('q')){S.qdone[g('q')]=t.checked;touch();}
 else if(g('risk')){S.rstat[g('risk')]=t.value;touch();}
 else if(g('fs')){S.fstat[g('fs')]=t.checked?'closed':'';touch();}
});
function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(()=>fallback());}else fallback();function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}}
render();
})();
