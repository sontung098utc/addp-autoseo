services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseo_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autoseo_network

  web:
    image: nginx:1.27-alpine
    container_name: autoseo_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - autoseo_network

  db:
    image: mariadb:10.11
    container_name: autoseo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-autoseo}
      MYSQL_USER: ${DB_USERNAME:-autoseo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-autoseo_secret}
    volumes:
      - autoseo_db_data:/var/lib/mysql
    networks:
      - autoseo_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: autoseo_redis
    restart: unless-stopped
    volumes:
      - autoseo_redis_data:/data
    networks:
      - autoseo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseo_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - autoseo_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseo_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
    networks:
      - autoseo_network

networks:
  autoseo_network:
    driver: bridge

volumes:
  autoseo_db_data:
  autoseo_redis_data:
